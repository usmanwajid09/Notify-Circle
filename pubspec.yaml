name: task_manager
description: A comprehensive task management application with local notifications.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Fonts
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_staggered_animations: ^1.1.1
  date_picker_timeline: ^1.2.5

  # State Management
  get: ^4.6.6
  get_storage: ^2.1.1

  # Database
  sqflite: ^2.3.3
  sqlite3_flutter_libs: ^0.5.0
  path: ^1.9.0

  # Notifications (LOCAL only - works on physical device)
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.4
  flutter_timezone: ^1.0.8

  # Date & Time
  intl: ^0.19.0

  # Export
  csv: ^6.0.0
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^9.0.0

  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
